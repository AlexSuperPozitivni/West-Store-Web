<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 480" width="520" height="480">
  <defs>
    <clipPath id="apple-clip">
      <path d="M260 30 C240 30 225 15 215 5 C210 0 200 -2 195 5 C185 20 175 50 170 70
               C140 65 105 75 80 100 C50 130 35 170 35 215
               C35 270 50 320 75 360 C100 400 135 435 175 455
               C200 467 225 475 260 475 C295 475 320 467 345 455
               C385 435 420 400 445 360 C470 320 485 270 485 215
               C485 170 470 130 440 100 C415 75 380 65 350 70
               C345 50 335 20 325 5 C320 -2 310 0 305 5
               C295 15 280 30 260 30Z"/>
    </clipPath>
    <linearGradient id="stripe-red" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e8220b"/>
      <stop offset="100%" stop-color="#f44820"/>
    </linearGradient>
    <linearGradient id="stripe-orange" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f47e12"/>
      <stop offset="100%" stop-color="#f89a30"/>
    </linearGradient>
    <linearGradient id="stripe-yellow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f5c800"/>
      <stop offset="100%" stop-color="#ffe14a"/>
    </linearGradient>
    <linearGradient id="stripe-green" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1fa94e"/>
      <stop offset="100%" stop-color="#3dc46a"/>
    </linearGradient>
    <linearGradient id="stripe-blue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0077d4"/>
      <stop offset="100%" stop-color="#29a0e5"/>
    </linearGradient>
    <linearGradient id="stripe-pink" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#d41876"/>
      <stop offset="100%" stop-color="#f03a90"/>
    </linearGradient>
    <linearGradient id="leaf-grad" x1="0" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#0066cc"/>
      <stop offset="100%" stop-color="#00aadd"/>
    </linearGradient>
  </defs>

  <!-- Apple black outline -->
  <path d="M260 30 C240 30 225 15 215 5 C210 0 200 -2 195 5 C185 20 175 50 170 70
           C140 65 105 75 80 100 C50 130 35 170 35 215
           C35 270 50 320 75 360 C100 400 135 435 175 455
           C200 467 225 475 260 475 C295 475 320 467 345 455
           C385 435 420 400 445 360 C470 320 485 270 485 215
           C485 170 470 130 440 100 C415 75 380 65 350 70
           C345 50 335 20 325 5 C320 -2 310 0 305 5
           C295 15 280 30 260 30Z"
        fill="#111" stroke="#000" stroke-width="6"/>

  <!-- Colorful stripes inside apple -->
  <g clip-path="url(#apple-clip)">
    <!-- Red stripe (top) - wavy -->
    <path d="M30 80 C100 95 180 75 260 90 C340 105 420 80 490 95 L490 160 C420 145 340 170 260 155 C180 140 100 165 30 150Z" fill="url(#stripe-red)"/>
    <!-- Orange stripe -->
    <path d="M30 150 C100 165 180 140 260 155 C340 170 420 145 490 160 L490 220 C420 205 340 230 260 215 C180 200 100 225 30 210Z" fill="url(#stripe-orange)"/>
    <!-- Yellow stripe -->
    <path d="M30 210 C100 225 180 200 260 215 C340 230 420 205 490 220 L490 280 C420 265 340 290 260 275 C180 260 100 285 30 270Z" fill="url(#stripe-yellow)"/>
    <!-- Green stripe -->
    <path d="M30 270 C100 285 180 260 260 275 C340 290 420 265 490 280 L490 340 C420 325 340 350 260 335 C180 320 100 345 30 330Z" fill="url(#stripe-green)"/>
    <!-- Blue stripe -->
    <path d="M30 330 C100 345 180 320 260 335 C340 350 420 325 490 340 L490 400 C420 385 340 410 260 395 C180 380 100 405 30 390Z" fill="url(#stripe-blue)"/>
    <!-- Pink stripe (bottom) -->
    <path d="M30 390 C100 405 180 380 260 395 C340 410 420 385 490 400 L490 490 C420 490 340 490 260 490 C180 490 100 490 30 490Z" fill="url(#stripe-pink)"/>
  </g>

  <!-- Leaf -->
  <path d="M255 55 C250 40 248 20 260 5 C275 15 278 38 272 55 C268 65 260 65 255 55Z"
        fill="url(#leaf-grad)" stroke="#004488" stroke-width="2"/>

  <!-- Text banner background (angled) -->
  <g transform="rotate(-8, 260, 260)">
    <rect x="45" y="225" width="430" height="70" rx="4" fill="rgba(255,255,255,0.92)" stroke="#ddd" stroke-width="1"/>
    <!-- WEST-STORE text -->
    <text x="260" y="275" text-anchor="middle" font-family="'Impact', 'Arial Black', 'Helvetica Neue', sans-serif" font-size="56" font-weight="900" fill="#1a1a1a" letter-spacing="3">WEST-STORE</text>
  </g>
</svg>