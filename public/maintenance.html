<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<!-- Авто-перезагрузка: как только тех. работы закончатся, посетитель сам вернётся на сайт -->
<meta http-equiv="refresh" content="45">
<title>Технические работы — WEST-STORE</title>
<style>
  :root{
    --blue:#2563eb;
    --blue-light:#60a5fa;
    --ink:#0b1020;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,sans-serif;
    background:var(--ink);
    color:#fff;
    min-height:100dvh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
    overflow:hidden;
    position:relative;
  }

  /* ===== Анимированный фон (плавающие световые пятна) ===== */
  .bg{position:fixed;inset:0;z-index:0;overflow:hidden;background:
      radial-gradient(1200px 800px at 50% -10%, #1b2550 0%, transparent 60%),
      linear-gradient(160deg,#0b1020 0%,#0d1430 50%,#0a0f24 100%);}
  .blob{position:absolute;border-radius:50%;filter:blur(60px);opacity:.55;mix-blend-mode:screen;animation:float 18s ease-in-out infinite}
  .blob.b1{width:460px;height:460px;background:#2563eb;top:-120px;left:-80px;animation-delay:0s}
  .blob.b2{width:380px;height:380px;background:#7c3aed;bottom:-100px;right:-60px;animation-delay:-6s}
  .blob.b3{width:300px;height:300px;background:#06b6d4;top:40%;left:55%;animation-delay:-11s}
  @keyframes float{
    0%,100%{transform:translate(0,0) scale(1)}
    33%{transform:translate(40px,-30px) scale(1.08)}
    66%{transform:translate(-30px,25px) scale(.95)}
  }
  /* Звёздная пыль */
  .stars{position:fixed;inset:0;z-index:0;background-image:
      radial-gradient(1.5px 1.5px at 20% 30%,rgba(255,255,255,.7),transparent),
      radial-gradient(1.5px 1.5px at 70% 60%,rgba(255,255,255,.5),transparent),
      radial-gradient(1px 1px at 40% 80%,rgba(255,255,255,.6),transparent),
      radial-gradient(1px 1px at 85% 25%,rgba(255,255,255,.5),transparent),
      radial-gradient(1.5px 1.5px at 55% 15%,rgba(255,255,255,.6),transparent);
    animation:twinkle 4s ease-in-out infinite alternate}
  @keyframes twinkle{from{opacity:.35}to{opacity:.9}}

  /* ===== Карточка ===== */
  .card{
    position:relative;z-index:1;width:100%;max-width:560px;text-align:center;
    background:rgba(255,255,255,.06);
    border:1px solid rgba(255,255,255,.12);
    border-radius:32px;
    padding:48px 40px 40px;
    backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
    box-shadow:0 30px 80px rgba(0,0,0,.45);
    animation:rise .8s cubic-bezier(.16,1,.3,1) both;
  }
  @keyframes rise{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}

  /* Бренд */
  .brand{display:inline-flex;align-items:center;gap:12px;margin-bottom:34px}
  .brand-badge{
    width:42px;height:42px;border-radius:12px;
    background:linear-gradient(135deg,var(--blue),var(--blue-light));
    display:flex;align-items:center;justify-content:center;font-weight:800;font-size:20px;
    box-shadow:0 8px 20px rgba(37,99,235,.5);
  }
  .brand-name{font-size:20px;font-weight:800;letter-spacing:3px}

  /* ===== Анимация шестерёнок ===== */
  .gears{position:relative;width:150px;height:130px;margin:6px auto 30px}
  .gear{position:absolute;color:rgba(255,255,255,.92)}
  .gear svg{display:block;filter:drop-shadow(0 6px 16px rgba(37,99,235,.45))}
  .gear.big{top:8px;left:18px;animation:spin 8s linear infinite}
  .gear.small{top:54px;left:78px;color:var(--blue-light);animation:spin-rev 5s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes spin-rev{to{transform:rotate(-360deg)}}
  /* Пульсирующее свечение под шестерёнками */
  .gears::after{content:"";position:absolute;inset:-30px;border-radius:50%;
    background:radial-gradient(circle,rgba(37,99,235,.35),transparent 65%);
    animation:pulse 2.6s ease-in-out infinite;z-index:-1}
  @keyframes pulse{0%,100%{opacity:.5;transform:scale(.9)}50%{opacity:1;transform:scale(1.1)}}

  h1{font-size:30px;font-weight:800;line-height:1.2;margin-bottom:14px;letter-spacing:-.5px}
  .accent{background:linear-gradient(90deg,var(--blue-light),#a78bfa);-webkit-background-clip:text;background-clip:text;color:transparent}
  p.lead{font-size:16px;line-height:1.6;color:rgba(255,255,255,.72);max-width:420px;margin:0 auto 30px}

  /* Индикатор прогресса (бесконечный) */
  .progress{height:6px;border-radius:999px;background:rgba(255,255,255,.1);overflow:hidden;margin:0 auto 34px;max-width:340px}
  .progress span{display:block;height:100%;width:40%;border-radius:999px;
    background:linear-gradient(90deg,var(--blue),var(--blue-light));
    animation:slide 1.6s ease-in-out infinite}
  @keyframes slide{0%{margin-left:-40%}100%{margin-left:100%}}

  /* Контакты */
  .contacts{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
  .btn{display:inline-flex;align-items:center;gap:8px;padding:13px 22px;border-radius:14px;
    font-size:15px;font-weight:600;text-decoration:none;color:#fff;transition:transform .15s,box-shadow .15s,background .15s}
  .btn svg{width:18px;height:18px}
  .btn:active{transform:scale(.96)}
  .btn-tg{background:#0088cc}
  .btn-tg:hover{background:#0099e6;box-shadow:0 8px 22px rgba(0,136,204,.45)}
  .btn-wa{background:#22c35e}
  .btn-wa:hover{background:#27d268;box-shadow:0 8px 22px rgba(34,195,94,.45)}
  .btn-call{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18)}
  .btn-call:hover{background:rgba(255,255,255,.18)}

  .note{margin-top:26px;font-size:13px;color:rgba(255,255,255,.4)}

  @media(max-width:480px){
    .card{padding:38px 22px 32px;border-radius:26px}
    h1{font-size:24px}
    p.lead{font-size:15px}
    .brand-name{font-size:18px;letter-spacing:2px}
    .contacts{flex-direction:column}
    .btn{width:100%;justify-content:center}
  }
  @media(prefers-reduced-motion:reduce){
    .blob,.stars,.gear,.gears::after,.progress span,.card{animation:none}
  }
</style>
</head>
